# USD per 1M input and output tokens, per model.
# Each entry carries `source` (the URL the price was read from) and
# `as_of` (the date the price was confirmed).
#
# A model absent from this file still gets a ledger row - expected_cost=0,
# unit=microusd, token counts in rows - so the call is VISIBLE and visibly
# unpriced. A missing row and a free call are indistinguishable in the
# ledger, and that is the failure TASK-323 fixes.
#
# TASK 0073, 2026-10-16: that zero stopped meaning "free". A model absent
# here now prices as UNKNOWN in `src/modelprices.py`, the ledger row it
# writes is marked `priced: false`, a governed client with any finite
# ceiling refuses the call outright, and a report containing such a row
# says "UNKNOWN TOTAL - a floor, not a total" with the known part reported
# as `expected_floor`. Models this repository names that NOBODY has priced
# are declared, with reasons, in `modelprices.DELIBERATELY_UNPRICED` -
# claude-opus-5, grok-4.6, anthropic/claude-3.5-sonnet today - rather than
# as entries here, because an entry in this file is a claim of a sourced
# price and they have none. Do not add a price you cannot source. When you
# read one of these figures, read its `as_of` first: a provider can change
# a rate between the day it was confirmed and the day it is summed.

# THE GLM ENTRIES ARE 20 DAYS OLD AT 2026-10-16 (TASK 0073 marks the age
# rather than refreshing it: a refresh needs the live page, and a guessed
# refresh is a wrong price wearing a new date - worse than a visibly old
# one). CACHE RATES ARE DELIBERATELY ABSENT: z.ai bills cache reads at a
# fraction of the input rate and TASK-355 owns measuring that fraction; a
# cache-read cost spanning a reported ~19x range is 36% of the price RANGE
# for these models and does not live in this file until that task sources
# it. Every glm figure below is therefore the NO-CACHE price.
glm-5.3:
  input_per_1m: 0.40
  output_per_1m: 1.60
  source: "https://z.ai/pricing"
  as_of: "2026-09-26"

glm-5.3-flash:
  input_per_1m: 0.10
  output_per_1m: 0.40
  source: "https://z.ai/pricing"
  as_of: "2026-09-26"

claude-sonnet-4-20250514:
  input_per_1m: 3.00
  output_per_1m: 15.00
  source: "https://docs.anthropic.com/en/docs/about-claude/models"
  as_of: "2026-09-26"

# THE SAME MODEL UNDER THE SLUG OPENROUTER USES, AND THE SLUG OUR OWN CODE
# ASKS FOR. `scripts/task425_one_account_dry_run.py` sets
# POLICY_MODEL = "anthropic/claude-sonnet-4"; `price_for` is an exact-key
# lookup, so that request missed the dated key above and every completion
# ledgered at expected_cost=0. Measured on the TASK-425 matrix: 287 ledger
# rows, expected_total 0, the artifact itself warning that zero did not mean
# nothing was spent.
#
# WRITTEN AS AN EXPLICIT ALIAS RATHER THAN BY STRIPPING THE VENDOR PREFIX IN
# CODE. Stripping "anthropic/" leaves "claude-sonnet-4", which still is not
# "claude-sonnet-4-20250514" - so the lookup would then have to guess which
# dated snapshot an undated slug means, and guessing wrong prices a call at
# another model's rate. A wrong price is worse than a missing one: a missing
# price is visibly zero and says nobody priced it, while a wrong price looks
# like an answer. Every alias therefore carries its own source and as_of and
# is auditable on its own line.
anthropic/claude-sonnet-4:
  input_per_1m: 3.00
  output_per_1m: 15.00
  source: "https://docs.anthropic.com/en/docs/about-claude/models"
  as_of: "2026-09-28"

