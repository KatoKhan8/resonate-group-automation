# BUILD-SPEC section 4. Nothing parses this yet: Phase 1 only checks that the
# file exists before it will ingest a batch for this client.
name: Productive
domain: productive.test
booking_link: https://productive.test/get-started/
sender:
  mode: client_rep          # engine writes no signature, sending inbox adds it
  # TASK-075: the connection note must say who is writing. These fields reach
  # the prompt via `clients.sender_identity` and `generate.context_for`.
  # `works_on` is the load-bearing fallback: when name and role are absent
  # the note says what the sender does rather than inventing a name.
  name: Ivan                # client representative
  role: founder
  company: Productive
  works_on: project profitability for agencies
market:
  must: services business that tracks time
  size_min_employees: 20
  # OPERATOR DECISION, 2026-09-23: align this list to
  # Productive's ICP as recorded in the client's structural criteria
  # (docs/FREE-GEOGRAPHY-AND-TYPE-2026-09-16.md). The eight entries that stood
  # here were NARROWER than the client's own ICP, which is why the 2026-09-07
  # file read 65.3% IN with geo - not headcount - as the binding criterion.
  # Seventeen entries, `Nordics` counted as one; it expands to Sweden, Norway,
  # Denmark, Finland and Iceland in the judge.
  geos: [United Kingdom, Ireland, Netherlands, Germany, France, Nordics,
         Belgium, Austria, Switzerland, Spain, Italy, Portugal, Poland,
         Australia, New Zealand, United States, Canada]
  # Also from the same reference, and widened from three. Widening a BLOCK
  # list only ever refuses more, so it is the safe direction to take on the
  # reference's authority.
  exclude_geos: [India, Pakistan, United Arab Emirates, Bangladesh, Sri Lanka,
                 Philippines, Indonesia, Vietnam, Thailand, Malaysia, China,
                 Singapore, Hong Kong, Japan, South Korea, Taiwan]
  flag_dont_drop: true      # out-of-geo gets flagged for human call, not dropped
# The same list again, under the key the scorer reads.
#
# `market.geos` above reaches `personas.icp_flags`, which writes a flag onto
# the record. It never reaches `icp.score`, which looks only at
# `config["icp"]["markets"]` - so with no `icp:` block the geography dimension
# was skipped for every company and Productive's stated markets counted for
# nothing in the verdict. This is a transcription of the line above, not a new
# policy: country names match `segment["country"]` exactly and "Nordics"
# matches the region, so nothing is widened RELATIVE TO THE LINE ABOVE.
#
# CORRECTED 2026-09-23: this comment used to end "Belgium does not become a
# target by way of Benelux, nor Austria by way of DACH." Both ARE targets now
# - they are named on the client's own ICP - and they were reached by naming
# them, not by a region expanding. The warning it was making is still the
# right one, so it is kept in that form rather than deleted.
#
# Deliberately absent: `thresholds.min_employees`. `size_min_employees: 20`
# above is a real number, but setting it here makes "under twenty" a decisive
# negative worth -25, which rejects the company outright - and `flag_dont_drop`
# on the line above says Productive wants those flagged for a human instead.
# Weights, penalties and the tier thresholds are likewise left at the module
# defaults, because no evidence in this repository says Productive has ever
# reviewed them.
icp:
  markets: [United Kingdom, Ireland, Netherlands, Germany, France, Nordics,
            Belgium, Austria, Switzerland, Spain, Italy, Portugal, Poland,
            Australia, New Zealand, United States, Canada]

  # ---------------------------------------------------------------- V2
  #
  # THE CLIENT'S OWN CRITERIA, AND THEY ARE THE WHOLE ICP TEST.
  #
  # What was here before scored twelve dimensions and called the total an ICP
  # verdict. Five of those dimensions were structural and seven were PAIN -
  # does this company's website mention utilisation, profitability, resource
  # planning, timesheets. The arithmetic made that fatal: structural weights
  # sum to 55 and `tier_b` is 60, so a flawless marketing agency of the right
  # size in the right country whose site never says "utilisation" could not
  # exceed tier C no matter what. Measured on this cohort: 16 of 300
  # qualified, and 300 of 300 carried "no evidence for time tracking need".
  #
  # Pain evidence is not an ICP criterion. It decides WHAT WE SAY, not WHOM WE
  # TARGET, and it now lives in research and personalisation where it belongs.
  # These five criteria decide whom we target, and nothing else does.
  #
  # UNKNOWN IS NOT FAIL. A criterion we could not establish leaves the company
  # eligible-with-uncertainty; only affirmative evidence of a violation fails
  # it. "We failed to prove it" and "we know it is not so" are different
  # answers and only one of them is a rejection.
  structural:
    # Affirmative membership of `exclude` fails. Membership of `include`
    # passes. Anything else - including a country nobody could establish - is
    # unknown, because `location_why: no usable location evidence` was the
    # commonest note on this cohort and it is not evidence of being in Asia.
    geographies:
      include: [United Kingdom, Ireland, Netherlands, Germany, France,
                Nordics, Sweden, Norway, Denmark, Finland, Belgium, Austria,
                Switzerland, Spain, Italy, Portugal, Poland, Australia,
                New Zealand, United States, Canada]
      exclude: [India, Pakistan, United Arab Emirates, Bangladesh, Sri Lanka,
                Philippines, Indonesia, Vietnam, Thailand, Malaysia, China,
                Singapore, Hong Kong, Japan, South Korea, Taiwan]

    # The client's words: marketing agencies and software agencies. The
    # verticals below are the segment classifier's own vocabulary, so this is
    # a mapping onto what the engine can actually say, not a new taxonomy.
    company_types:
      primary: [marketing_agency, software_agency]
      verticals: [Creative / Branding Agency, Digital Marketing Agency,
                  Performance Marketing Agency, Advertising Agency,
                  Media Agency, PR Agency, Design Studio,
                  Software Development Agency, Web Development Agency,
                  Product Studio, Digital Agency, Consultancy,
                  Technology Consultancy, Marketing Agency]

    services_business_required: true

    # A must-have in the client document, and the one that most needs the
    # unknown/fail distinction. A homepage that does not say "we track time"
    # is not a company that does not track time. Only affirmative evidence
    # that it does NOT - a product company selling licences, say - fails here.
    tracks_time_required: true

    # PROVIDER HEADCOUNTS ARE ESTIMATES AND THE TOLERANCE SAYS SO.
    # The effective floor is derived - min * (1 - tolerance) = 14 - and is
    # never written as 14 anywhere in the engine. A company at 14-19 is a size
    # pass with tolerance; below that it fails only if the number came from a
    # source good enough to reject on. Unknown headcount is unknown.
    employees:
      min: 20
      tolerance: 0.30
      # A HEADCOUNT ESTIMATE THAT REVENUE CONTRADICTS IS NOT A SMALL COMPANY.
      #
      # Measured on this cohort: 28 companies whose stored headcount is under
      # the tolerated floor also carry revenue of $3M or more, and one of them
      # reports four people against $172.7M. That is a broken estimate, not a
      # four-person agency, and rejecting on it is rejecting on data the
      # record itself contradicts.
      #
      # Agency revenue per head runs roughly $100-200k, so thirteen people
      # could plausibly produce about $2.6M at the top of that range. Above
      # this figure the headcount and the revenue cannot both be right.
      #
      # The company does NOT pass on revenue - revenue is not a headcount.
      # Size becomes UNKNOWN, which leaves the other four criteria to decide
      # and keeps the company out of `icp_pass`. Unset or 0 disables it.
      revenue_contradicts_below_millions: 3
# Public-evidence research. Bounded here rather than by `--cap`, because Apify
# bills in compute units and `COSTS["apify-research"]` is zero - the credit cap
# cannot see this spend at all. These four numbers are the only ceiling there
# is: at most `max_runs_per_batch` runs in a batch, five pages of one domain,
# twenty items, and `research.run` refuses a run for a record that already has
# the structured evidence it would go looking for.
#
# RAISED FROM 10 TO 75 ON 2026-09-12, ON A MEASUREMENT RATHER THAN A HUNCH.
#
# Ten was set deliberately low while nothing was known about what research was
# worth. It is now known, from the 300-record Productive estate:
#
#     researched      n=72   medium-or-high ICP confidence 13.9%   mean score 23.9
#     not researched  n=228  medium-or-high ICP confidence  0.0%   mean score  7.8
#
# Research is the ONLY path out of `unknown` in this model - `source_diversity`
# and `recency` score zero on all 300 records whatever happens, so coverage is
# the one component that moves, and it moves from a 0.417 ceiling to 0.75.
# At ten runs a batch, the 149 records still unqualified needed fifteen more
# batches to find out whether any of them is a customer. `funnel.py` had
# already written the same sentence about a 200-domain cohort: "max_runs_per_
# batch is 10, so 183 of 200 domains never got a scrape."
#
# Seventy-five, not unbounded. One batch now covers half the remaining cohort
# in roughly ninety minutes at the measured 86s per company, which keeps a
# shard small enough to checkpoint, observe and abandon. The ceiling stays a
# ceiling: compute units are still a number this system is never told, so the
# only honest control is how many runs it starts.
research:
  apify:
    enabled: true
    max_runs_per_batch: 75
    max_items_per_run: 20
    max_pages_per_domain: 5
personas:
  champion:
    # Delivery, production and studio leadership added 2026-09-09 on an
    # operator decision. At a 20-100 person agency these roles own the thing
    # Productive sells to: who is booked on what, whether a project is burning
    # its budget, and where the next hire has to go. They are not founder copy
    # and they are not finance copy.
    #
    # Added as a family rather than as named people: the titles below are how
    # the role is spelled, and the `routing.strategies` block at the foot of
    # this file puts each one in the persona family whose angle it should get.
    # A title outside both lists still fails closed - `personas.classify`
    # returns None and the contact is set aside as "not a persona for this
    # client", which is what happened to all four of these before today.
    #
    # THE FIVE RESOURCE-MANAGEMENT SPELLINGS ADDED 2026-09-13. The
    # `routing.strategies` block at the foot of this file already listed all
    # seven of them as `resource_management` targets, which is what a paid
    # ContactOut search actually goes looking for - and `personas.classify`
    # recognised only two, so five of the seven titles this client pays to
    # find would have been set aside as "not a persona for this client" the
    # moment one came back. Two lists that say who we target, disagreeing.
    # This is not a widening of who Productive sells to: it is the persona
    # list catching up with the search this client is already buying.
    titles: [Operations Manager, Operations Director, Project Manager,
             Vice President Operations, VP Operations,
             Finance Manager, Head of Finance, Head of Operations,
             Head of Production, Production Director,
             Design Studio Manager, Studio Manager,
             Head of Resource Management, Head of Resourcing,
             Resource Manager, Resourcing Manager, Traffic Manager,
             Project Director, Design Director]
    cap_per_domain: 2
    angles:
      finance: margin per project, month end reconciliation, multi entity billing
      delivery: live budget burn, scope creep, resourcing visibility
      # Renamed from `ops`. `personas.default_angle` matches an angle key
      # against the ROUTING FAMILY a title belongs to, and the families are
      # named `operations`, `finance`, `delivery`, `resource_management` and
      # `founder`. `ops` matched none of them, so under the operations_led
      # strategy a champion could only ever receive an angle when the family
      # came back `finance` - every operations lead and every studio manager
      # got None and was held on `domains_contact_no_angle`. Same words, a key
      # that lines up with the thing it is matched against.
      operations: utilisation, capacity planning, one system not five
      resource_management: who is booked on what next week, and where the next hire goes
  economic_buyer:
    # The spelled-out forms of the abbreviations already on this line.
    # `personas.title_score` needs an exact match, a containment, or every
    # word over three characters shared, and none of those join "COO" to
    # "Chief Operating Officer" - so a real COO who writes the title out
    # in full was excluded as "not a persona for this client" while a
    # "President & COO" at the same seniority was kept. Same role, and
    # not a widening of who Productive sells to.
    # President, Managing Partner and Chair added 2026-09-21, the same
    # correction this list already carries for COO: a person who runs the
    # company and writes the title differently is the same buyer. Seventeen
    # leads were held as "not a persona for this client" and six of them were
    # Presidents. `Chief Executive` without `Officer` is here for "Chair and
    # Group Chief Executive", which contains neither of the existing forms.
    titles: [CFO, Chief Financial Officer, COO, Chief Operating Officer,
             CEO, Chief Executive Officer, Chief Executive, Owner, Founder,
             President, Managing Partner, Chair, Chairman,
             Managing Director, Direktor]
    cap_per_domain: 1
    start_offset_days: 5    # buyer track starts behind champion track
    angles:
      founder: profitability visible on Monday not two weeks late
      # ADDED 2026-09-21 by Claude under the operator's instruction to "map
      # the 338 no-angle titles to the nearest Productive persona and angle
      # yourself, using the playbook; do not wait for my approval".
      #
      # The comment below says a finance angle goes in only "when there is
      # something true to say to a finance lead". There is, and it is already
      # in this file twice: the CHAMPION persona's own `finance` angle, and
      # `product.capabilities.profitability`. These are the client's words
      # about their own product, not a new claim - a CFO at an agency and a
      # Finance Manager at the same agency care about the same thing, and one
      # of them was already being written to about it.
      #
      # 40 leads in batch 1's pool were held on this alone: 32 "Chief
      # Financial Officer" and 8 "CFO", every one of them ICP-IN, verified
      # and collision-clear.
      finance: margin per project, month end reconciliation, multi entity billing
      # An operations lead is not a founder. `personas.default_angle` matches
      # an angle key to the routing family the title belongs to, so a COO gets
      # this one and a CEO gets `founder`. Without it a COO inherited founder
      # copy because the persona defined only that angle.
      #
      # There is deliberately no `finance` angle here. A CFO is eligible as an
      # economic buyer and has no angle that fits, so `default_angle` returns
      # None, lint raises `domains_contact_no_angle` and the contact is held -
      # which is the wanted answer. Add one only when there is something true
      # to say to a finance lead.
      operations: utilisation and capacity across live projects
# The short topic a subject line may name. `angles` above is the argument a
# message makes and is too long for a subject: lint fails at 60 characters,
# "how teams your size handle " is 27, and the founder phrase is 50. Widening
# the lint rule to fit it is forbidden, so the wording gives instead - these
# are the same words, shortened, never a new claim.
#
# Top level rather than inside a persona on purpose. /settings/personas
# rewrites a persona as titles, cap and angles, so a label kept in there would
# be dropped the first time somebody edited that persona in the product.
angle_labels:
  finance: project margin at month end
  delivery: budget burn and resourcing
  # Kept after the `ops` -> `operations` rename above, because a contact
  # selected before it still carries `angle: ops` and must still get a
  # readable subject rather than the fallback.
  ops: utilisation and capacity
  operations: utilisation and capacity
  resource_management: who is booked next week
  founder: profitability on Monday
# THE LINKEDIN-HEAVY HYPOTHESIS, 2026-09-13: ~5 email touches and ~6 LinkedIn
# activities over ~21 days. Defined in `src/cadencelibrary.py` rather than
# here because a client file cannot hold a list of mappings - `clients.parse`
# reads scalars and inline scalar lists, and an inline list of mappings comes
# back split on its commas.
#
# Switching to `productive_balanced_v1` is how the two intensities get
# compared, and it is this one line. That is the property that matters: the
# alternative is a sequence pasted into several modules.
cadence: productive_li_heavy_v1

# WHAT WE ARE SELLING. THE MODEL WAS NEVER TOLD.
#
# Measured 2026-09-14 by rendering the real `linkedin_note` prompt for
# `ogpartner-dk`: the string "Productive" occurs ZERO times in it. So do
# "time tracking", "budgeting", "resourcing" and "invoicing". The model was
# asked to write four LinkedIn messages, one of whose jobs is to say what the
# product does, on behalf of a product it had never been told about.
#
# What it had was `angle_wording` - two phrases for this persona - so every
# rung reached for the same one. The generated sequence for Jacob Faertz asked
# about profitability four times in four different ways, and the ladder took
# the blame for it. The ladder is right; the input was missing.
#
# This is the same gap `generate.context_for` already closed one level down,
# and the comment there says it in the same words: the model "was handed
# `angle: "founder"` and no statement of what the client actually sells. It
# filled the gap by inventing a pitch". It still was, one level up.
#
# `what_it_is` is the one-line answer to "what is this". `capabilities` is the
# menu a rung SELECTS FROM, never a list to recite: the prompt rule is that a
# message names the capabilities that fit this person's angle and stays silent
# about the rest. A feature list pasted into a LinkedIn note is the failure
# this block is most likely to cause, so it is named here as well as in the
# prompt.
#
# These are Productive's own words, taken from the hand-written fallback copy
# further down this file - "we built productive so budgets, time tracking and
# resourcing talk to each other" - which is the copy that reads better than
# anything the model produced. It is not a new claim about the product.
product:
  name: Productive
  what_it_is: one place where an agency's budgets, time tracking, resourcing and invoicing talk to each other instead of living in separate tools
  capabilities:
    project_management: projects, tasks and delivery in one place
    time_tracking: time booked against the project and the budget it belongs to
    budgeting: what a project was quoted at and what it has burned so far
    resource_planning: who is booked on what next week, and where the next hire goes
    billing: invoices raised from the time and the budget rather than retyped
    profitability: margin per project while it is running, not after it closes
  # WHICH ONE CAPABILITY RUNG 3 NAMES, PER PERSONA. Added 2026-09-25 with the
  # approved rung-3 copy; read by `cadence.product_words`, which resolves
  # `{capability}` to the sentence above - the client's own words, unedited.
  #
  # ONE CAPABILITY, NOT A MENU. Rung 3's job is "name the product, one
  # capability, one consequence"; a template carrying two would be a feature
  # list, which is the thing that rung deliberately is not.
  #
  # `budgeting` for the champion because it is the one capability true to all
  # FOUR champion angles - finance, delivery, operations and
  # resource_management. `resource_planning` is true to one of them.
  #
  # CLIENT-WIDE, AND NOT NESTED INSIDE A PERSONA ON PURPOSE.
  # `web/api.save_persona` rebuilds a persona as exactly `titles`,
  # `cap_per_domain` and `angles`, so a key kept in there is dropped the first
  # time somebody edits that persona in the product. `angle_labels` sits
  # client-wide for exactly this reason. The failure would be quiet: rung 3
  # would start being held and the cadence would get shorter with no error.
  capability_by_persona:
    economic_buyer: profitability
    champion: budgeting

# THE LINKEDIN HALF OF THAT CADENCE DID NOT EXIST UNTIL THIS LINE.
#
# `productive_li_heavy_v1` is six LinkedIn activities and li2..li6 are all
# marked `generated`. `generate.plan` writes a LinkedIn note only when this
# mode is `llm`, and it defaulted to `template` - so nothing ever wrote copy
# for those five steps, and `cadence.expand_step` drops a generated step that
# has no stored copy.
#
# Measured 2026-09-13 on `16kagency-com`, building the real timeline against
# this real config: ONE LinkedIn step. li1 survives because it names the
# `linkedin_intro` template; li2..li6 were absent from the timeline
# entirely. Adding a confirmed connection event changed nothing - li1 went to
# `skipped`, correctly, and the other five still did not appear. A connected
# prospect had SIX zero executable LinkedIn touches against five email ones.
#
# That is exactly the failure `cadencelibrary.py`'s own docstring warns
# about: a cadence that quietly drops steps reports eleven touches and sends
# one. The email half was never affected, which is why it went unnoticed.
#
# `template` remains the right default for a client who has not chosen -
# it costs nothing and it cannot wander. Productive has chosen: four of the
# six LinkedIn activities are message opportunities, and four messages that
# each have a different job cannot come from one template. The ladder in
# `generate.LINKEDIN_LADDER` is what gives each rung its own job.
linkedin_connection_note:
  mode: llm

# WHAT A PROSPECT READS IF THEIR OWN WORDS DO NOT ARRIVE.
#
# A HeyReach sequence is campaign-level, so each step's copy travels per lead
# in a custom field named after the step's graph role and the graph carries
# `{connection_note}`, `{connected_1}` and so on. HeyReach does NOT error on a
# variable it cannot fill - it sends `fallbackMessage` instead, silently. So
# every role needs one, `heyreachfactory.merge_sequence_copy` REFUSES without
# it, and the words are declared here rather than invented by the factory: a
# fallback the code wrote is unapproved copy reaching a real person at exactly
# the moment something has already gone wrong.
#
# `heyreach.refuse_unsupported_sequence` should make these unreachable - it
# refuses the whole push unless every lead supplies every variable. These are
# the second line, for the case where the provider substitutes differently
# than we believe it does.
#
# THEY ASSERT NOTHING ABOUT THE READER. No prior contact, no named pain, no
# claim about their company, nothing the record would have to support - because
# by definition nothing personalised is available when one of these fires. They
# are true of any agency and they are the only copy in this system written to
# be true of a stranger.
linkedin_sequence:
  fallbacks:
    connection_note: hi, i work with agencies on project profitability and thought it would be good to connect.
    connected_1: how do you currently get visibility on whether a project is making money while it is still running?
    connected_2: most agencies i speak to find that out at the end of a project rather than during it. is that how it works for you?
    connected_3: we built productive so budgets, time tracking and resourcing talk to each other. worth a look?
    connected_4: happy to leave it here if the timing is wrong. is there someone else who owns this?
    message_2: how do you currently get visibility on whether a project is making money while it is still running?
    message_3: most agencies i speak to find that out at the end of a project rather than during it. is that how it works for you?
    message_4: we built productive so budgets, time tracking and resourcing talk to each other. worth a look?
tone:
  email: polished, professional, no em dashes, no buzzwords, no fluff openers
  linkedin: casual, lowercase, human

# Which persona family each title belongs to, for this client only.
#
# `personas.classify` decides WHETHER a contact is a persona, from the title
# lists above. This decides WHICH ANGLE they get, by naming the family whose
# key matches one of the persona's angles. The two are separate on purpose: a
# title can be a legitimate Productive persona and still have nothing true to
# say to it, and that case must end in a hold rather than in borrowed copy.
#
# Overriding a persona replaces its list rather than extending it, so every
# default kept is restated here.
routing:
  strategies:
    operations_led:
      personas:
        operations: [COO, Chief Operating Officer, Operations Director,
                     Head of Operations, Head of Delivery, Operations Manager,
                     Head of Production, Production Director]
        # Project and design leadership own delivery at this size, and the
        # delivery angle - budget burn, scope creep, resourcing visibility - is
        # what they answer for.
        delivery: [Project Director, Design Director, Project Manager,
                   Delivery Director]
        finance: [Finance Director, Head of Finance, Financial Controller,
                  Finance Manager]
        resource_management: [Head of Resource Management, Resource Manager,
                              Resourcing Manager, Head of Resourcing,
                              Traffic Manager, Studio Manager,
                              Design Studio Manager]
        founder: [Founder, CEO, Chief Executive Officer, Managing Director]
      priority: [operations, delivery, resource_management, finance, founder]

# Which provider estate this client's data lives in. CONFIGURATION, not engine
# logic: the engine reads it through `clients.provider_workspace` and refuses
# when it is absent, so a second client can never inherit these by default.
#
# emailbison.workspace is the id `bison.bound_workspace()` reports for this
# credential; heyreach.org_unit is the organizationUnitId every campaign of
# this client carries. Both were read from the providers rather than assumed.
providers:
  emailbison:
    workspace: 10
  heyreach:
    org_unit: 118832

# A RUNAWAY GUARD, NOT A COST TARGET. Enrichment credits are authorised for
# this client's production execution, so these are set far above anything a
# legitimate batch costs: the priced estimate for the 250-record shard is 37
# credits expected and 54 worst case. What they stop is a loop - a retry that
# re-buys the same people, or a stage that fans out without a cap - which is
# the only way this number gets reached at all.
#
# `spendledger.check` reads these before every paid call and `enrich.spend`
# refuses on them. Absent, all four scopes are null and nothing refuses on
# cost, which is what was true here until now.
# WHEN A CAMPAIGN MAY SEND.
#
# Read by `bisonfactory` and written to EmailBison as the campaign schedule.
# There is deliberately no default: a campaign staged without a window would
# inherit whatever the provider does, and "nobody chose a sending window" must
# not look the same as a chosen one.
#
# ASSUMPTION TO CONFIRM: the timezone is the SENDER's, not the prospect's -
# EmailBison schedules one window per campaign, so a campaign spanning US and
# EU prospects sends in this window regardless of where they are. Europe/
# Zagreb is Productive's own working day. If the intent is to land in a US
# morning, this needs to be a second campaign with its own window rather than
# a wider one here.
# THE SEQUENCE A STAGED CAMPAIGN CARRIES.
#
# EmailBison merge fields are SINGLE-BRACE and UPPERCASE - `{FIRST_NAME}`,
# `{COMPANY}` - and `{a|b|c}` is spintax, not a field. Read off the client's
# own live campaign 352 on 2026-09-13, which uses FIRST_NAME, COMPANY,
# SENDER_FIRST_NAME, INDUSTRY, TITLE and HEADLINE.
#
# WHAT THAT CAMPAIGN DOES NOT DO is reference `subject` or `body` - not once
# across its 44 steps. So the per-lead copy this system generates has no
# consumer there: staging a lead into 352 with `subject`/`body` custom
# variables would carry words nothing reads.
#
# A campaign THIS system builds uses `{SUBJECT}` and `{BODY}`, which resolve
# to the custom variables each staged lead carries - so the generated,
# approved, lint-checked copy is what goes out.
#
# VERIFIED 2026-09-13: EmailBison DOES render `{SUBJECT}` from a custom
# variable named `subject`. Campaign 451's scheduled email reads back with
# `email_subject: "Profitability visible on Monday, not two weeks late"` and a
# fully rendered body - the approved copy, not the merge field. This was read
# off `/scheduled-emails` before the send, so it needed no send to prove.
# The line above used to say the opposite and gated resuming on it.
#
# FIVE STEPS, KEYED BY CADENCE STEP. Each key below names a step in
# `productive_li_heavy_v1`, which is what lets `bisonfactory._sequence_steps`
# check the declared delay against the cadence gap it claims to reproduce
# rather than trusting it. Declaring a key the cadence does not have, or
# omitting one it does, is refused.
#
# A CUSTOM VARIABLE HOLDS ONE VALUE PER LEAD, which is why the merge fields
# are numbered. `{SUBJECT_3}` resolves to the variable `subject_3`, which
# carries the words approved for `em3` on that contact - matched by step key,
# never by position, because approvals are fingerprinted per step key.
#
# `wait_in_days` IS THE WAIT AFTER A STEP. Measured on the client's own live
# campaign 352 on 2026-09-13 over 381 scheduled-email pairs whose two steps
# declare different waits: the gap matches the EARLIER step's wait. So these
# four numbers are the cadence's own gaps - em1 day 1 to em2 day 4 is 3, em2
# to em3 is 4, em3 to em4 is 4, em4 day 12 to em5 day 21 is 9.
#
# THE FIFTH WAIT HAS NO SUCCESSOR and is checked against nothing. It is
# written because the provider takes a number and "nobody chose" must not
# look the same as a chosen one.
#
# IT IS 1 AND NOT 0 BECAUSE THE PROVIDER REFUSED 0. Measured 2026-09-13:
# staging campaign 481 with a terminal `wait_in_days: 0` was rejected by
# `POST /campaigns/481/sequence-steps` and left the campaign holding zero
# steps - so the whole payload is refused atomically, which is the only
# reason this was safe to diagnose on an append-only route. The client's own
# 44-step campaign 352 never stores 0 either: its waits are 1, 3 and 4, and
# the minimum across all 44 is 1. The number still means nothing, because
# nothing follows em5.
#
# The single-step shape - `subject`, `body`, `wait_in_days` at this level -
# still works and is what campaign 451 was staged against. It is production
# evidence with a scheduled send on it, so it is not migrated.
# THE AUDITED CONTROL SEQUENCE. Three steps 2026-09-16, FOUR from 2026-09-24.
#
# This block named em1 through em5 until the operator approved the CONTROL
# sequence. That mattered more than it looks: the factory writes one provider
# step per entry here, so campaign 484 was created carrying FIVE steps while
# only em1-em3 had approved copy - and `_ensure_leads` refused all ten
# contacts with "each missing step sends a real person an email with an empty
# subject and an empty body, and every readback would agree the campaign was
# correct". The gate was right; the config was wrong.
#
# CONTROL WAS persona_pain -> comparable_proof -> breakup, three steps, waits
# 3 and 4 with the last step carrying 1 because nothing follows it. From
# 2026-09-24 it is persona_pain -> comparable_proof -> angle_shift_<persona>
# -> close_<persona>: four steps, waits 3, 4, 5 and a terminal 1, with
# `breakup` retired from this client's sequence. `breakup` is NOT deleted
# from `src/cadence.py` - it stays correct for a cadence that really is three
# steps - it simply must not be the last thing this client sends, because
# "I will leave it here" is false when two more emails follow it.
#
# THREAD-REPLY INVARIANT, 2026-09-16: only the opener owns a subject.
#
# The operator verified the desired behaviour in the EmailBison UI: follow-ups
# must stay in the original thread, and only the opener owns a subject. Every
# step's `email_subject` references `{SUBJECT_1}`. The opener sends it as the
# subject. The follow-ups are thread replies, so the provider continues the
# original thread and prepends `Re:` itself. There is exactly ONE subject
# variable per lead - `subject_1` - and no `subject_2` or `subject_3` exists
# to be generated, approved, or accidentally sent.
#
# Do not write `Re:` into a subject yourself. The provider prepends it, and
# `EMAILBISON-COPY-REQUIREMENTS.md` says not to. A hand-built `Re:` chain is
# simulated threading, which is the thing being forbidden.
# FIVE STEPS FROM 2026-09-25: em1, em2, em3, em4, em5. `breakup` IS RETIRED.
#
# HOW THIS GOT HERE, BECAUSE THE KEYS LOOK ODD OTHERWISE. On 2026-09-24 this
# block went to FOUR steps - em1, em2, em4, em5 - with `breakup` retired and
# em3's POSITION left deliberately empty, because rung 3 was unwritten and
# filling it with a restatement of em2 just to reach five would have been
# worse than a gap. Rung 3 was approved on 2026-09-25 and took that position
# under the key `em3`. The other keys did not move when it arrived, and that
# is the whole reason they were not renumbered at four steps: the key is
# identity here and everywhere else - approvals are fingerprinted per step key
# and `push_id` is `record:contact:step:channel` - so renumbering would hand
# one message's approvals to another.
#
# `em3` IS NO LONGER `breakup`, AND OLDER RECORDS STILL SAY IT IS. Records
# written before 2026-09-25 hold breakup's words under em3 and belong to the
# eleven campaigns that keep the three-step cadence. The words travel ON THE
# RECORD and `_certified_copy` re-verifies the approval fingerprint against
# them, so a record can only ever send the words its own approval covers.
# `scripts/batch1_build.py` never rewrites an existing record's cadence, which
# is what keeps the two apart.
#
# THE KEYS HERE MUST EQUAL THE CAMPAIGN ROW'S `cadence_steps` EMAIL KEYS, in
# day order, or `bisonfactory._sequence_steps` refuses the whole stage. The
# campaign-side half of this change is `CADENCE_STEPS` in
# `scripts/batch1_build.py`. Campaign rows written BEFORE this change still
# carry em1/em2/em3 and are refused by this config - measured, not assumed,
# in `docs/MERGE-REQUEST-2026-09-24-CADENCE-FOUR-STEPS.md`.
#
# THE STEP KEY IS NOT THE VARIABLE NUMBER. THEY AGREE HERE BY COINCIDENCE.
# `bisonfactory._variables_for` numbers the copy variables BY POSITION. At
# five steps position and key happen to line up - em3 is the third step and
# reads `{BODY_3}` - and at FOUR steps they did not: em4 was the third step
# and read `{BODY_3}`, em5 was the fourth and read `{BODY_4}`. Derived from
# the code both times, not assumed. If a step is ever removed again, the
# bodies below renumber by POSITION and the keys stay put.
#
# THERE IS NO `{SUBJECT_2}`, although two approved copy documents ask for one.
# em4 was drafted to open a NEW thread with a second subject. The threading
# invariant added 2026-09-16 - operator-verified in the EmailBison UI -
# refuses exactly that: "step 4 is not a thread reply but carries a distinct
# subject". So every follow-up is a thread reply on `{SUBJECT_1}`. That is a
# DECISION an operator may overturn, and overturning it is a change to
# `bisonfactory`, not to this file.
email_sequence:
  title: Resonate CONTROL
  # FIVE ENTRIES, ONE PER DECLARED STEP. `_sequence_steps` reads this
  # positionally, so a spare entry describes a sequence this block does not
  # declare and a missing one silently defaults the LAST step to a new thread
  # with no subject of its own - which is the failure, not the length.
  thread_reply_pattern: [false, true, true, true, true]
  steps:
    em1:
      order: 1
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_1}</p>"
      wait_in_days: 3
    em2:
      order: 2
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_2}</p>"
      wait_in_days: 4
    em3:
      order: 3
      subject: "{SUBJECT_1}"
      # Rung 3 from 2026-09-25, NOT `breakup`. Position 3, hence BODY_3.
      body: "<p>{BODY_3}</p>"
      # Cadence day 8 to day 12.
      wait_in_days: 4
    em4:
      order: 4
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_4}</p>"
      # Cadence day 12 to day 21.
      wait_in_days: 9
    em5:
      order: 5
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_5}</p>"
      # 1, not 0. `wait_in_days` is the gap until the NEXT step, so on the
      # final step it is inert - nothing follows it. But 0 was rejected by the
      # provider: campaign 485 was created and `set_sequence` raised, leaving
      # it at 0 steps. TASK-159 specified 3/4/0 and TASK-184 recorded the last
      # one as "unchecked"; this is the check. The five-step config this
      # replaced carried 1 on its own last step and wrote successfully.
      wait_in_days: 1

sending_window:
  days: [monday, tuesday, wednesday, thursday, friday]
  start: "09:00"
  end: "17:00"
  timezone: Europe/Zagreb

# OPERATOR DECISION, 2026-09-25: `per_day` 5,000 -> 15,000 credits.
#
# ~7,575 addresses a day at the measured 1.98 credits/address. Cost is
# reported daily. `total` is UNCHANGED at 50,000 and is the ceiling that
# actually binds: 4,444 credits are committed against it, so the headroom is
# 45,556, and the amended 09-07 supply is - to 0.2% - exactly one budget
# wide. At 15,000/day that budget is gone in three days, so the third day is
# a decision point and not a surprise.
#
# `per_run` IS NOW ENFORCED BY `spendledger.check`, BY RESERVATION.
# It was declared here and enforced by nothing until 2026-09-25, which is how
# a chunk stopped at 2,044 credits against this 2,000 while every test
# passed: the tests ran at `--workers 1` and production runs at 8, and a cap
# tested after each answer can only report an overshoot. `spendledger.reserve`
# now claims the credits before the call, under one lock, so K workers cannot
# each see room only one of them can have. `--max-credits` on
# `stage_s5_verify.py` is now a belt beside a brace rather than the only
# control there is.
#
# OPERATOR DECISION, 2026-09-25: THE PER-PROVIDER CEILINGS ARE THE CAPS.
#
# The client-level `total` of 50,000 is REMOVED and the per-provider `total`
# ceilings replace it. `per_day: 200000` stays as a SANITY CEILING ONLY - a
# tripwire against a runaway loop, not a budget. Nothing is expected to
# approach it; if anything does, that is a bug and not a busy day.
#
# THE REMOVAL AND THE REPLACEMENT ARE ONE CHANGE, AND THAT IS THE POINT.
# Until today `total: 50000` was the ONLY lifetime cap this estate had.
# Removing it a commit before the per-provider totals are enforced leaves
# the account bounded by nothing at all, and a 200,000/day tripwire cannot
# catch a runaway that happens inside one day. So the two land together, and
# `spendledger.check` now REFUSES a paid call that no lifetime ceiling
# covers: with no client `total` and no `budget.providers.<name>.total`, a
# call raises `MissingCeiling` rather than reading `None` as unlimited. A
# missing cap must never parse as an unlimited one - that is the same class
# of defect as an empty expectation matching everything.
#
# `per_run` IS NOW ENFORCED, BY RESERVATION. It was declared here and
# enforced by nothing until today, which is how a chunk stopped at 2,044
# credits against a declared 2,000 while every test passed: the tests ran at
# `--workers 1` and production runs at 8, and a cap tested after each answer
# can only report an overshoot. `spendledger.reserve` claims the credits
# before the call, under one lock, so K workers cannot each see room only one
# of them can have.
#
# THE CLIENT `per_run` OF 2,000 IS GONE WITH THE `total`. It contradicted the
# operator's required CheapVerifier `per_run` of 10,000 outright - a
# 10,000-credit CheapVerifier run would have been refused at 2,001 by a
# CLIENT ceiling - and the decision above makes the per-provider ceilings the
# caps. If a client-wide `per_run` tripwire is wanted, it has to be at least
# as large as the largest provider `per_run` or it silently becomes the real
# ceiling; nothing invents one here.
#
# CHEAPVERIFIER'S 100,000 IS THE ACCOUNT BALANCE, NOT A POLICY NUMBER.
# Reaching it does not mean the ceiling worked, it means a batch halts
# part-finished with rows bought and rows not. `spendledger.CRITICAL_REMAINING`
# alerts at 10,000 remaining - about one large batch of warning, so a top-up
# can happen between batches instead of during one.
#
# `unlimited` IS A DECISION AND AN ABSENT KEY IS NOT. ContactOut and Apify
# are deliberately uncapped in THIS ledger and say so in as many words, so
# that a provider somebody forgets to declare is refused rather than
# silently unbounded.
budget:
  per_day: 200000
  providers:
    cheapverifier:
      total: 100000
      per_day: 95000
      per_run: 10000
    deliverable:
      total: 500000
      per_day: 95000
    reoon:
      total: 500000
      per_day: 95000
    # Operator decision 2026-09-25: no ledger cap on ContactOut. Its credits
    # are prepaid and the provider reports its own remaining balance, which
    # `scripts/credential_health.py --verify` reads.
    contactout:
      total: unlimited
    # APIFY'S NUMBERS IN THIS LEDGER ARE INTEGER CENTS, NOT CREDITS.
    #
    # `src/researchpack/actors.py` prices each actor run in cents - 5, 4 and
    # 6 - and `pack.run_actor` writes that figure into this same spend
    # ledger. So `per_day: 5000` below is the operator's 5,000 $-cents a
    # day, in the unit Apify's rows already use. It is NOT credits, and it
    # is NOT comparable to Deliverable's 95,000.
    #
    # THAT MIXING IS A REAL HAZARD AND IT IS NAMED, NOT HIDDEN. The
    # client-wide `per_day` of 200,000 above sums cents and credits, which
    # is arithmetic over two different units. It is a tripwire rather than a
    # budget so the sum is still useful as "nothing should ever get near
    # this", but nobody should read it as an amount. Picking a conversion
    # rate is an operator decision; see
    # docs/MERGE-REQUEST-2026-09-25-PER-PROVIDER-CEILINGS.md.
    #
    # `total: unlimited` because the operator set a daily figure and no
    # lifetime one. Written rather than omitted: an absent key is refused.
    #
    # The OTHER Apify path - `research.apify` above, the website crawler -
    # is priced at zero by `COSTS["apify-research"]` and is bounded by
    # `max_runs_per_batch`, `max_items_per_run` and `max_pages_per_domain`
    # instead. This ceiling does not see it.
    apify:
      total: unlimited
      per_day: 5000
    # BLITZ AND AIARK ARE NOT IN THE OPERATOR'S DECISION, AND THIS IS NOT A
    # DECISION EITHER - IT IS THE CEILING THEY ALREADY HAD, CARRIED FORWARD.
    #
    # Both have spend (blitz 232, aiark 70) and neither is named in the
    # 2026-09-25 table. Until today they were bounded by the client `total`
    # of 50,000, which that decision REMOVED. That leaves two bad options
    # and no good one: leave them undeclared and `check` refuses every one
    # of their calls - measured, it silently disables aiark's contact
    # fallback and blitz's headcount lookup, and turned five green e2e
    # tests red - or write `unlimited` and let a cap nobody decided parse
    # as no cap, which is the exact thing this change exists to prevent.
    #
    # So neither. 50,000 is the number that was in force for these two
    # providers the moment before the swap, carried forward unchanged. It
    # invents no policy, it cannot be mistaken for a considered figure at
    # their spend levels, and it keeps the invariant that every provider
    # this estate pays has a declared lifetime ceiling.
    #
    # THIS NEEDS AN OPERATOR. Either name them in the decision table or say
    # `unlimited` deliberately, the way ContactOut is said. Tracked in
    # docs/MERGE-REQUEST-2026-09-25-PER-PROVIDER-CEILINGS.md section 9.1.
    blitz:
      total: 50000
    aiark:
      total: 50000

# HOW OFTEN ONE PERSON, AND ONE COMPANY, MAY HEAR FROM PRODUCTIVE.
#
# Every number below was a library default until now. `fatigue.limits()`
# reports whether a value was CONFIGURED or DEFAULTED precisely so that a
# screen cannot present a fallback as a decision, and every one of these
# read `configured: false` - including the two that decide whether
# account-based outreach is possible at all.
#
# THE ONE THAT ACTUALLY BINDS. `pilotcaps.CEILING` carries
# `touches_per_account_per_week: 4` and `pilotcaps.CONSTRAINS` points it at
# `fatigue.account.max_touches_per_week`. Nothing joins them:
# `executionguard` calls `pilotcaps.require` with `email_per_day`,
# `linkedin_per_day` and `per_sender_per_day` only, and `fatigue` never
# consults `pilotcaps` at all. So the ceiling of 4 has no consumer on any
# send path, and the number that decided how hard a company was worked was
# the library default of 8. Writing 4 here is what makes 4 true.
# PACED FOR THE LINKEDIN-HEAVY CADENCE, and every number is derived from it
# rather than chosen. `productive_li_heavy_v1` is 11 touches over 21 days:
# five in week one, three in each of weeks two and three.
#
# The previous values were set for the seven-step email-led shape and would
# have collapsed this one to about three touches - the weekly cap blocking
# day 6, the total blocking day 10 onward, and the cross-channel minimum
# blocking the day-1 email because a LinkedIn action happens the same day. A
# cadence that silently runs a third of itself is worse than one that
# refuses, because it reports eleven touches and sends four.
fatigue:
  contact:
    # ZERO, deliberately. Day one is a connection request AND an email: the
    # point of a coordinated cadence is that the channels arrive together.
    # Pacing lives on the per-channel rule below, which is what actually
    # protects somebody from being worn down.
    min_hours_between_touches: 0

    # Two touches on ONE channel stay 48h apart. The tightest the sequence
    # asks for is 72h (li2 day 3 -> li3 day 6), so this has headroom and
    # still refuses a same-day repeat on the same channel.
    min_hours_between_same_channel_touches: 48

    # Week one carries five - li1, em1, li2, em2, li3. Six leaves one touch
    # of headroom for a rescheduled step without licensing a seventh.
    max_touches_per_week: 6

    # Eleven is the whole sequence. Twelve so a single replayed or
    # rescheduled step does not terminate a contact mid-cadence.
    max_touches_total: 12

  account:
    # Unchanged, and still the binding constraint: EmailBison 422s a lead
    # that is `in_sequence` anywhere else, and `collision.account_policy`
    # STOPs the whole domain while anybody there is mid-sequence. One email
    # track plus one LinkedIn track is what the providers permit.
    max_active_contacts: 2

    # Two people at 11 touches each would be 22 in three weeks. Eight caps
    # the COMPANY in any rolling week: roughly one fully-worked primary plus
    # a staggered second.
    max_touches_per_week: 8

    # The operator's day-2/3 stagger, as a number, so testing it is an edit
    # to this line.
    min_hours_between_first_touches: 72

# VERIFICATION ROLES — operator decision, Zvonimir, 2026-09-21.
#
# ContactOut is REMOVED from verification. It stays FIRST for ENRICHMENT,
# where the standing provider order is unchanged; this block is verification
# only and the two are different questions about the same address.
#
# Scoped to this client rather than edited into `verification.DEFAULT_POLICY`,
# because `policy_for` exists precisely so one workspace's roles are not
# every workspace's. The defaults are untouched and still read
# contactout/deliverable/reoon for anybody else.
#
# WHAT DOES NOT CHANGE, and each is load-bearing:
#   required_confirmations stays 2  - two INDEPENDENT providers, because one
#     verifier is a single point of failure with a commercial interest in
#     saying yes
#   disagreement stays `hold`       - a negative blocks whatever else agrees
#   unknown is never PASS
#   accept_all_clears_on stays reoon - clearing a catch-all is Reoon's job
#     through is_safe_to_send, and Deliverable alone does not clear one
#
# CONSEQUENCE WORTH STATING: with two roles filled by two distinct providers
# and two confirmations required, there is no third opinion left. Both must
# answer and both must agree. That is stricter than the previous arrangement,
# not looser.
verification:
  primary: deliverable
  secondary: reoon
  catch_all: reoon

# THE PRODUCTIVE LINKEDIN STANDARD, chosen 2026-09-21 under the operator's
# instruction to "clone the best-performing graph as the standard LinkedIn
# cadence for every Resonate-run campaign, step for step, with the same delays
# and branching... Record the chosen graph as the Productive LinkedIn standard
# in the workspace config, with the source campaign id and date".
#
# Chosen on both halves of the funnel rather than on volume:
#
#     565765  requests   951  accepted 129 (13.6%)  replies 23 (17.8% of accepted)
#     523983  requests 15770  accepted 1694 (10.7%) replies 228 (13.5% of accepted)
#     524002  requests 22896  accepted 1165 (5.1%)  replies 153 (13.1% of accepted)
#
# OMEGA 2 has sixteen times the volume and converts worse at both steps. The
# graph itself is CHECK_IS_CONNECTION -> MESSAGE, with three message variants
# carrying {FIRST_NAME} and an {Icebreaker} filled per lead.
#
# The graph CANNOT live in this file - `clients.parse` reads scalars and inline
# scalar lists, and a HeyReach node is a nested mapping. It is stored verbatim
# beside it, as read from the provider, so a clone is a copy rather than a
# re-typing.
linkedin_standard_source: 565765
linkedin_standard_file: config/linkedin/productive-standard.json
linkedin_standard_chosen: 2026-09-21
linkedin_connection_requests_per_seat_day: 10
# THE CLIENT-APPROVAL EXPORT.  What columns the snapshot CSV carries and how
# often it is produced.  The cadence is weekly, Monday 07:00 Zagreb local
# time - which moves with DST because `geo.zone` resolves the IANA name, not
# a fixed UTC offset.  On 2026-10-25 Europe/Zagreb shifts from CEST (UTC+2)
# to CET (UTC+1), so 07:00 local becomes 06:00 UTC rather than 05:00 UTC.
# A hardcoded hour would land the export an hour early for half the year.
#
# A second client is onboardable by adding this block to their config file.
# No `if client == "productive"` anywhere in the engine.
client_approval_export:
  columns: [domain, company, headcount, industry, country, website]
  cadence:
    frequency: weekly
    day_of_week: monday
    local_time: "07:00"
    timezone: Europe/Zagreb
