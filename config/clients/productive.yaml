# BUILD-SPEC section 4. Nothing parses this yet: Phase 1 only checks that the
# file exists before it will ingest a batch for this client.
name: Productive
domain: productive.test
booking_link: https://productive.test/get-started/
sender:
  mode: client_rep          # engine writes no signature, sending inbox adds it
market:
  must: services business that tracks time
  size_min_employees: 20
  geos: [United Kingdom, Ireland, Netherlands, Germany, France, Nordics,
         Australia, United States]
  exclude_geos: [India, Pakistan, United Arab Emirates]
  flag_dont_drop: true      # out-of-geo gets flagged for human call, not dropped
# The same list again, under the key the scorer reads.
#
# `market.geos` above reaches `personas.icp_flags`, which writes a flag onto
# the record. It never reaches `icp.score`, which looks only at
# `config["icp"]["markets"]` - so with no `icp:` block the geography dimension
# was skipped for every company and Productive's stated markets counted for
# nothing in the verdict. This is a transcription of the line above, not a new
# policy: country names match `segment["country"]` exactly and "Nordics"
# matches the region, so nothing is widened. Belgium does not become a target
# by way of Benelux, nor Austria by way of DACH.
#
# Deliberately absent: `thresholds.min_employees`. `size_min_employees: 20`
# above is a real number, but setting it here makes "under twenty" a decisive
# negative worth -25, which rejects the company outright - and `flag_dont_drop`
# on the line above says Productive wants those flagged for a human instead.
# Weights, penalties and the tier thresholds are likewise left at the module
# defaults, because no evidence in this repository says Productive has ever
# reviewed them.
icp:
  markets: [United Kingdom, Ireland, Netherlands, Germany, France, Nordics,
            Australia, United States]

  # ---------------------------------------------------------------- V2
  #
  # THE CLIENT'S OWN CRITERIA, AND THEY ARE THE WHOLE ICP TEST.
  #
  # What was here before scored twelve dimensions and called the total an ICP
  # verdict. Five of those dimensions were structural and seven were PAIN -
  # does this company's website mention utilisation, profitability, resource
  # planning, timesheets. The arithmetic made that fatal: structural weights
  # sum to 55 and `tier_b` is 60, so a flawless marketing agency of the right
  # size in the right country whose site never says "utilisation" could not
  # exceed tier C no matter what. Measured on this cohort: 16 of 300
  # qualified, and 300 of 300 carried "no evidence for time tracking need".
  #
  # Pain evidence is not an ICP criterion. It decides WHAT WE SAY, not WHOM WE
  # TARGET, and it now lives in research and personalisation where it belongs.
  # These five criteria decide whom we target, and nothing else does.
  #
  # UNKNOWN IS NOT FAIL. A criterion we could not establish leaves the company
  # eligible-with-uncertainty; only affirmative evidence of a violation fails
  # it. "We failed to prove it" and "we know it is not so" are different
  # answers and only one of them is a rejection.
  structural:
    # Affirmative membership of `exclude` fails. Membership of `include`
    # passes. Anything else - including a country nobody could establish - is
    # unknown, because `location_why: no usable location evidence` was the
    # commonest note on this cohort and it is not evidence of being in Asia.
    geographies:
      include: [United Kingdom, Ireland, Netherlands, Germany, France,
                Nordics, Sweden, Norway, Denmark, Finland, Belgium, Austria,
                Switzerland, Spain, Italy, Portugal, Poland, Australia,
                New Zealand, United States, Canada]
      exclude: [India, Pakistan, United Arab Emirates, Bangladesh, Sri Lanka,
                Philippines, Indonesia, Vietnam, Thailand, Malaysia, China,
                Singapore, Hong Kong, Japan, South Korea, Taiwan]

    # The client's words: marketing agencies and software agencies. The
    # verticals below are the segment classifier's own vocabulary, so this is
    # a mapping onto what the engine can actually say, not a new taxonomy.
    company_types:
      primary: [marketing_agency, software_agency]
      verticals: [Creative / Branding Agency, Digital Marketing Agency,
                  Performance Marketing Agency, Advertising Agency,
                  Media Agency, PR Agency, Design Studio,
                  Software Development Agency, Web Development Agency,
                  Product Studio, Digital Agency, Consultancy,
                  Technology Consultancy, Marketing Agency]

    services_business_required: true

    # A must-have in the client document, and the one that most needs the
    # unknown/fail distinction. A homepage that does not say "we track time"
    # is not a company that does not track time. Only affirmative evidence
    # that it does NOT - a product company selling licences, say - fails here.
    tracks_time_required: true

    # PROVIDER HEADCOUNTS ARE ESTIMATES AND THE TOLERANCE SAYS SO.
    # The effective floor is derived - min * (1 - tolerance) = 14 - and is
    # never written as 14 anywhere in the engine. A company at 14-19 is a size
    # pass with tolerance; below that it fails only if the number came from a
    # source good enough to reject on. Unknown headcount is unknown.
    employees:
      min: 20
      tolerance: 0.30
      # A HEADCOUNT ESTIMATE THAT REVENUE CONTRADICTS IS NOT A SMALL COMPANY.
      #
      # Measured on this cohort: 28 companies whose stored headcount is under
      # the tolerated floor also carry revenue of $3M or more, and one of them
      # reports four people against $172.7M. That is a broken estimate, not a
      # four-person agency, and rejecting on it is rejecting on data the
      # record itself contradicts.
      #
      # Agency revenue per head runs roughly $100-200k, so thirteen people
      # could plausibly produce about $2.6M at the top of that range. Above
      # this figure the headcount and the revenue cannot both be right.
      #
      # The company does NOT pass on revenue - revenue is not a headcount.
      # Size becomes UNKNOWN, which leaves the other four criteria to decide
      # and keeps the company out of `icp_pass`. Unset or 0 disables it.
      revenue_contradicts_below_millions: 3
# Public-evidence research. Bounded here rather than by `--cap`, because Apify
# bills in compute units and `COSTS["apify-research"]` is zero - the credit cap
# cannot see this spend at all. These four numbers are the only ceiling there
# is: at most `max_runs_per_batch` runs in a batch, five pages of one domain,
# twenty items, and `research.run` refuses a run for a record that already has
# the structured evidence it would go looking for.
#
# RAISED FROM 10 TO 75 ON 2026-09-12, ON A MEASUREMENT RATHER THAN A HUNCH.
#
# Ten was set deliberately low while nothing was known about what research was
# worth. It is now known, from the 300-record Productive estate:
#
#     researched      n=72   medium-or-high ICP confidence 13.9%   mean score 23.9
#     not researched  n=228  medium-or-high ICP confidence  0.0%   mean score  7.8
#
# Research is the ONLY path out of `unknown` in this model - `source_diversity`
# and `recency` score zero on all 300 records whatever happens, so coverage is
# the one component that moves, and it moves from a 0.417 ceiling to 0.75.
# At ten runs a batch, the 149 records still unqualified needed fifteen more
# batches to find out whether any of them is a customer. `funnel.py` had
# already written the same sentence about a 200-domain cohort: "max_runs_per_
# batch is 10, so 183 of 200 domains never got a scrape."
#
# Seventy-five, not unbounded. One batch now covers half the remaining cohort
# in roughly ninety minutes at the measured 86s per company, which keeps a
# shard small enough to checkpoint, observe and abandon. The ceiling stays a
# ceiling: compute units are still a number this system is never told, so the
# only honest control is how many runs it starts.
research:
  apify:
    enabled: true
    max_runs_per_batch: 75
    max_items_per_run: 20
    max_pages_per_domain: 5
personas:
  champion:
    # Delivery, production and studio leadership added 2026-09-09 on an
    # operator decision. At a 20-100 person agency these roles own the thing
    # Productive sells to: who is booked on what, whether a project is burning
    # its budget, and where the next hire has to go. They are not founder copy
    # and they are not finance copy.
    #
    # Added as a family rather than as named people: the titles below are how
    # the role is spelled, and the `routing.strategies` block at the foot of
    # this file puts each one in the persona family whose angle it should get.
    # A title outside both lists still fails closed - `personas.classify`
    # returns None and the contact is set aside as "not a persona for this
    # client", which is what happened to all four of these before today.
    titles: [Operations Manager, Operations Director, Project Manager,
             Finance Manager, Head of Finance, Head of Operations,
             Head of Production, Production Director,
             Design Studio Manager, Studio Manager,
             Project Director, Design Director]
    cap_per_domain: 2
    angles:
      finance: margin per project, month end reconciliation, multi entity billing
      delivery: live budget burn, scope creep, resourcing visibility
      # Renamed from `ops`. `personas.default_angle` matches an angle key
      # against the ROUTING FAMILY a title belongs to, and the families are
      # named `operations`, `finance`, `delivery`, `resource_management` and
      # `founder`. `ops` matched none of them, so under the operations_led
      # strategy a champion could only ever receive an angle when the family
      # came back `finance` - every operations lead and every studio manager
      # got None and was held on `domains_contact_no_angle`. Same words, a key
      # that lines up with the thing it is matched against.
      operations: utilisation, capacity planning, one system not five
      resource_management: who is booked on what next week, and where the next hire goes
  economic_buyer:
    # The spelled-out forms of the abbreviations already on this line.
    # `personas.title_score` needs an exact match, a containment, or every
    # word over three characters shared, and none of those join "COO" to
    # "Chief Operating Officer" - so a real COO who writes the title out
    # in full was excluded as "not a persona for this client" while a
    # "President & COO" at the same seniority was kept. Same role, and
    # not a widening of who Productive sells to.
    titles: [CFO, Chief Financial Officer, COO, Chief Operating Officer,
             CEO, Chief Executive Officer, Owner, Founder,
             Managing Director, Direktor]
    cap_per_domain: 1
    start_offset_days: 5    # buyer track starts behind champion track
    angles:
      founder: profitability visible on Monday not two weeks late
      # An operations lead is not a founder. `personas.default_angle` matches
      # an angle key to the routing family the title belongs to, so a COO gets
      # this one and a CEO gets `founder`. Without it a COO inherited founder
      # copy because the persona defined only that angle.
      #
      # There is deliberately no `finance` angle here. A CFO is eligible as an
      # economic buyer and has no angle that fits, so `default_angle` returns
      # None, lint raises `domains_contact_no_angle` and the contact is held -
      # which is the wanted answer. Add one only when there is something true
      # to say to a finance lead.
      operations: utilisation and capacity across live projects
# The short topic a subject line may name. `angles` above is the argument a
# message makes and is too long for a subject: lint fails at 60 characters,
# "how teams your size handle " is 27, and the founder phrase is 50. Widening
# the lint rule to fit it is forbidden, so the wording gives instead - these
# are the same words, shortened, never a new claim.
#
# Top level rather than inside a persona on purpose. /settings/personas
# rewrites a persona as titles, cap and angles, so a label kept in there would
# be dropped the first time somebody edited that persona in the product.
angle_labels:
  finance: project margin at month end
  delivery: budget burn and resourcing
  # Kept after the `ops` -> `operations` rename above, because a contact
  # selected before it still carries `angle: ops` and must still get a
  # readable subject rather than the fallback.
  ops: utilisation and capacity
  operations: utilisation and capacity
  resource_management: who is booked next week
  founder: profitability on Monday
cadence: productive_default
tone:
  email: polished, professional, no em dashes, no buzzwords, no fluff openers
  linkedin: casual, lowercase, human

# Which persona family each title belongs to, for this client only.
#
# `personas.classify` decides WHETHER a contact is a persona, from the title
# lists above. This decides WHICH ANGLE they get, by naming the family whose
# key matches one of the persona's angles. The two are separate on purpose: a
# title can be a legitimate Productive persona and still have nothing true to
# say to it, and that case must end in a hold rather than in borrowed copy.
#
# Overriding a persona replaces its list rather than extending it, so every
# default kept is restated here.
routing:
  strategies:
    operations_led:
      personas:
        operations: [COO, Chief Operating Officer, Operations Director,
                     Head of Operations, Head of Delivery, Operations Manager,
                     Head of Production, Production Director]
        # Project and design leadership own delivery at this size, and the
        # delivery angle - budget burn, scope creep, resourcing visibility - is
        # what they answer for.
        delivery: [Project Director, Design Director, Project Manager,
                   Delivery Director]
        finance: [Finance Director, Head of Finance, Financial Controller,
                  Finance Manager]
        resource_management: [Head of Resource Management, Resource Manager,
                              Resourcing Manager, Head of Resourcing,
                              Traffic Manager, Studio Manager,
                              Design Studio Manager]
        founder: [Founder, CEO, Chief Executive Officer, Managing Director]
      priority: [operations, delivery, resource_management, finance, founder]

# Which provider estate this client's data lives in. CONFIGURATION, not engine
# logic: the engine reads it through `clients.provider_workspace` and refuses
# when it is absent, so a second client can never inherit these by default.
#
# emailbison.workspace is the id `bison.bound_workspace()` reports for this
# credential; heyreach.org_unit is the organizationUnitId every campaign of
# this client carries. Both were read from the providers rather than assumed.
providers:
  emailbison:
    workspace: 10
  heyreach:
    org_unit: 118832

# A RUNAWAY GUARD, NOT A COST TARGET. Enrichment credits are authorised for
# this client's production execution, so these are set far above anything a
# legitimate batch costs: the priced estimate for the 250-record shard is 37
# credits expected and 54 worst case. What they stop is a loop - a retry that
# re-buys the same people, or a stage that fans out without a cap - which is
# the only way this number gets reached at all.
#
# `spendledger.check` reads these before every paid call and `enrich.spend`
# refuses on them. Absent, all four scopes are null and nothing refuses on
# cost, which is what was true here until now.
# WHEN A CAMPAIGN MAY SEND.
#
# Read by `bisonfactory` and written to EmailBison as the campaign schedule.
# There is deliberately no default: a campaign staged without a window would
# inherit whatever the provider does, and "nobody chose a sending window" must
# not look the same as a chosen one.
#
# ASSUMPTION TO CONFIRM: the timezone is the SENDER's, not the prospect's -
# EmailBison schedules one window per campaign, so a campaign spanning US and
# EU prospects sends in this window regardless of where they are. Europe/
# Zagreb is Productive's own working day. If the intent is to land in a US
# morning, this needs to be a second campaign with its own window rather than
# a wider one here.
# THE SEQUENCE A STAGED CAMPAIGN CARRIES.
#
# EmailBison merge fields are SINGLE-BRACE and UPPERCASE - `{FIRST_NAME}`,
# `{COMPANY}` - and `{a|b|c}` is spintax, not a field. Read off the client's
# own live campaign 352 on 2026-09-13, which uses FIRST_NAME, COMPANY,
# SENDER_FIRST_NAME, INDUSTRY, TITLE and HEADLINE.
#
# WHAT THAT CAMPAIGN DOES NOT DO is reference `subject` or `body` - not once
# across its 44 steps. So the per-lead copy this system generates has no
# consumer there: staging a lead into 352 with `subject`/`body` custom
# variables would carry words nothing reads.
#
# A campaign THIS system builds uses `{SUBJECT}` and `{BODY}`, which resolve
# to the custom variables each staged lead carries - so the generated,
# approved, lint-checked copy is what goes out.
#
# UNVERIFIED: that EmailBison renders `{SUBJECT}` from a custom variable named
# `subject`. The provider accepts and stores the merge field, and proving it
# RESOLVES requires a real send, which is blocked. Until then no campaign
# built from this may be resumed.
# One step, deliberately. This parser takes no block lists, and more
# importantly a SECOND generated step would need its own merge fields
# (`{SUBJECT_2}`, `{BODY_2}`) because a custom variable holds one value per
# lead - which is a design decision nobody has taken yet. One step that
# carries real approved copy beats five that carry a template.
email_sequence:
  title: Resonate generated cadence
  subject: "{SUBJECT}"
  body: "<p>{BODY}</p>"
  wait_in_days: 3

sending_window:
  days: [monday, tuesday, wednesday, thursday, friday]
  start: "09:00"
  end: "17:00"
  timezone: Europe/Zagreb

budget:
  per_day: 5000
  per_run: 2000
  total: 50000
