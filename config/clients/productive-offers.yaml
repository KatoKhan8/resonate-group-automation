# Approved campaign mechanisms, operator decision 2026-09-26.
# NOT authorised: discounts, guarantees, free consulting, free audits, custom
# implementations, POCs, customer-specific deliverables, pricing promises.
mechanisms:
  demo:
    what: Productive demo or walkthrough with a Productive AE
    status: OPERATOR_APPROVED
    link: https://productive.io/get-started/      # THE ONLY allowed CTA link, 2026-09-26
    notes: demo period of up to one month may be offered if needed
  # THE ONE LICENSED MECHANISM for both composed offers, operator 2026-09-27.
  ae_walkthrough_premium_trial:
    what: a walkthrough with a Productive AE that unlocks the premium trial including Productive's AI features
    status: CLIENT_APPROVED
    source: client confirmation, Bruno, 2026-09-27, approved in writing
    link: https://productive.io/get-started/
    provenance: the walkthrough and the premium trial it unlocks come from the client confirmation, NOT from page text. The AI features page states no AI pricing tier and its only trial wording is the self serve one below. Do not cite the page for the premium trial.
    notes: primary ask for both offers; for the economic buyer the walkthrough leads and the premium trial is secondary

  free_trial:
    what: free 14-day trial, no credit card required
    status: RECORDED_NOT_LICENSED_FOR_COPY
    licensed_for_copy: false
    link: https://productive.io/get-started/      # verified HEAD 200, 2026-09-26
    provenance: publicly stated on productive.io and present in the client original brief. NOT in canonical config - productive.yaml has no offers block, verified 2026-09-26. Client reconfirmation requested 2026-09-26.
    # One line deliberately: clients.parse() supports no folded or literal block
    # scalar, so a `>` or `|` value here raises ConfigError inside offers.load().
    withheld_reason: operator decision 2026-09-27, the self serve trial is out of prospect facing copy until its provenance is closed by client reconfirmation or canonical config; kept recorded rather than deleted so the decision stays auditable and the mechanism can be relicensed without being reinvented; superseded for copy by ae_walkthrough_premium_trial
  objective:
    what: interest -> booked meeting -> Productive AE -> discovery-led handoff
    status: OPERATOR_APPROVED
    notes: do not invent a longer sales process
