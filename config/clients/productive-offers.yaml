    what: Productive demo or walkthrough with a Productive AE
    status: OPERATOR_APPROVED
    link: https://productive.io/get-started/      # THE ONLY allowed CTA link, 2026-09-26
    notes: demo period of up to one month may be offered if needed
  # THE ONE LICENSED MECHANISM for both composed offers, operator 2026-09-27.
  ae_walkthrough_premium_trial:
    what: a walkthrough with a Productive AE that unlocks the premium trial including Productive's AI features
    status: CLIENT_APPROVED
    source: client confirmation, Bruno, 2026-09-27, approved in writing
    link: https://productive.io/get-started/
    provenance: the walkthrough and the premium trial it unlocks come from the client confirmation, NOT from page text. The AI features page states no AI pricing tier and its only trial wording is the self serve one below. Do not cite the page for the premium trial.
