  # The AI features page. Unlike the customer stories above, this one HAS its
  # page text stored, so an AI claim is traceable and quotable. Retrieved
  # 2026-09-27 from the public page, no authentication.
  #
  # WHAT THIS PAGE DOES AND DOES NOT SUPPORT. It supports what each named
  # feature DOES, in the page's own words. It does NOT support any figure, any
  # percentage, any time saved, or any hype wording, because the page states
  # none. It also states NO AI specific pricing tier: the page's only trial
  # wording is "Free 14-day trial. No credit card required. Cancel any time."
  # So "premium trial including the AI features" traces to the CLIENT
  # confirmation (Bruno, 2026-09-27) and NOT to this page. Those are two
  # different provenances and must not be collapsed into one.
  #
  # NOT FOR COLD COPY, operator 2026-09-27: Marble Engine, MCP Server,
  # Expenses Autofill, AI Writing Tools. Their text is deliberately not stored
  # here, so a lint tracing a claim to stored text cannot license them.
  productive_ai:
    name: Productive AI features
    url: https://productive.io/productive-ai/
    retrieved: 2026-09-27
    status: VERIFIED_PUBLIC
    naming_rule: the features may be referred to collectively only as "Productive's AI features"; individual features are named exactly as the page names them
    page_text:
      Report Intelligence: "Ask anything about your business data. Productive understands it and delivers the insights you're looking for already interpreted, in plain language."
      Project Summary: "Stay on top of every project without digging through updates. Get an executive summary or a quick recap so your team can align and move fast."
      AI Time Tracking: "Productive analyzes calendar events, matches them with previous time entries, and automatically fills out your time sheets."
      AI Notetaker: "The Notetaker that's integrated directly into your workspace. It transcribes, summarizes, and turns action items into tasks, so you can go from meeting to work right away."
      Agents: "Your autonomous, custom-built virtual assistants. Give them instructions and assign them to a specific area, and they handle the busywork for you."
      Smart Search: "Use your own words to search for Docs, Projects, Tasks, Budgets, and more. Find what you need, even when you don't know where to look for it."
      Smart Filters: "Use natural language prompts to see exactly what you need across Task, Budget, Deal, Time, and Resourcing views."
    trial_wording_on_page: "Free 14-day trial. No credit card required. Cancel any time."
    ai_pricing_tier_on_page: null

