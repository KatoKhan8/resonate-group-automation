# The Offer Library for Productive.
#
# Offers are DATA. No model creates one. Every field below comes from the
# client's own words in productive.yaml product.capabilities or from what the
# operator has explicitly supplied. No deliverable, discount, guarantee or
# commercial term is invented here.
#
# approval_status: pending | approved | refused
# An offer whose approval_status is not "approved" CANNOT reach copy
# generation. Production does not approve its own offers.
#
# Schema from ARCHITECTURE-UPGRADE-SPEC section 3E.

offers:
  OFFER-PM-001:
    capability: project_management
    segment: all
    persona: champion
    business_problem: projects tracked in spreadsheets and tools that do not talk to each other
    value_proposition: projects, tasks and delivery in one place
    concrete_deliverable: a single view of every project, its tasks and its delivery status
    supporting_evidence: []
    cta: see what your projects look like in one place
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: [503]

  OFFER-TT-001:
    capability: time_tracking
    segment: all
    persona: champion
    business_problem: time booked in one tool and budgets tracked in another
    value_proposition: time booked against the project and the budget it belongs to
    concrete_deliverable: time entries linked to the project and budget they belong to
    supporting_evidence: []
    cta: see where your team time actually goes
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: [503]

  OFFER-BU-001:
    capability: budgeting
    segment: all
    persona: economic_buyer
    business_problem: a project quoted at one number and burning at another with no visibility in between
    value_proposition: what a project was quoted at and what it has burned so far
    concrete_deliverable: budget burn visibility from quote to current spend
    supporting_evidence: []
    cta: know whether a project is making money while it is still running
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  OFFER-RP-001:
    capability: resource_planning
    segment: all
    persona: champion
    business_problem: no visibility on who is booked on what next week
    value_proposition: who is booked on what next week, and where the next hire goes
    concrete_deliverable: a forward-looking view of who is booked where and where the next hire goes
    supporting_evidence: []
    cta: see who is booked on what next week
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  OFFER-BI-001:
    capability: billing
    segment: all
    persona: economic_buyer
    business_problem: invoices retyped from time and budget records instead of raised from them
    value_proposition: invoices raised from the time and the budget rather than retyped
    concrete_deliverable: invoices generated directly from tracked time and project budgets
    supporting_evidence: []
    cta: stop retyping invoices from spreadsheets
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  OFFER-PR-001:
    capability: profitability
    segment: all
    persona: economic_buyer
    business_problem: margin visible only after a project closes, not while it is running
    value_proposition: margin per project while it is running, not after it closes
    concrete_deliverable: margin per project visible while the project is still running
    supporting_evidence: []
    cta: see project margin while the project is still running
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  # ------------------------------------------------- the two composed offers
  # Operator instruction, 2026-09-27: one offer for the economic buyer and one
  # for operations, posted for approval as two records.
  #
  # These COMPOSE the capability offers above. They invent nothing: every
  # business_problem, value_proposition and concrete_deliverable clause is
  # carried over from OFFER-PR/BU-001 (A) and OFFER-PM/TT/RP-001 (B).
  #
  # NO FIGURE AND NO CASE STUDY APPEARS IN EITHER. Every entry under `evidence`
  # has page_text: null, so there is nothing for the lint to trace a claim
  # against, and operator_summary is explicitly not quotable. Naming a customer
  # is CLIENT_APPROVED, but an offer that names one without a traceable claim
  # buys nothing and risks a figure being added later without its page text.
  # supporting_evidence stays empty until TASK-365 stores the page text.
  #
  # No dashes in any prospect facing field, per the standing rule. `14 day`
  # rather than the hyphenated form is deliberate, not a typo.
  #
  # approval_status is pending. Production does not approve its own offers and
  # neither does Claude. campaigns is empty: composing an offer attaches it to
  # nothing, and the production freeze stands.
  OFFER-A-ECONOMIC-BUYER:
    capability: profitability_and_budgeting
    composes: [OFFER-PR-001, OFFER-BU-001]
    segment: all
    persona: economic_buyer
    business_problem: margin is visible only after a project closes, and a project quoted at one number burns at another with no visibility in between
    value_proposition: margin per project while it is running, and what a project was quoted at against what it has burned so far
    concrete_deliverable: margin per project visible while the project is still running, and budget burn visibility from quote to current spend
    supporting_evidence: []
    cta: see project margin and budget burn while the project is still running
    mechanism: ae_walkthrough_premium_trial
    mechanism_text: a walkthrough with a Productive AE
    mechanism_secondary_text: the walkthrough may also offer the premium trial
    mechanism_status: CLIENT_APPROVED
    mechanism_source: client confirmation, Bruno, 2026-09-27
    mechanism_note: the walkthrough is the primary ask for the economic buyer, per the operator 2026-09-27
    # At most ONE ai capability per email and one per LinkedIn message, chosen by
    # persona and account facts. AI supports the capability argument and never
    # replaces it. page_text is VERBATIM evidence, not copy: copy is derived from
    # it, must not exceed it, and must carry no dashes.
    ai_capabilities:
      - feature: Report Intelligence
        page_text: "Ask anything about your business data. Productive understands it and delivers the insights you're looking for already interpreted, in plain language."
        traces_to: productive_ai
      - feature: Project Summary
        page_text: "Stay on top of every project without digging through updates. Get an executive summary or a quick recap so your team can align and move fast."
        traces_to: productive_ai
    cta_link: https://productive.io/get-started/
    conditions: no commercial terms, capability description only
    approval_status: pending
    version: 2
    # The operator approved version 1's positioning, value proposition and
    # deliverable on 2026-09-27. That approval does NOT carry to version 2:
    # the mechanism changed and ai capabilities were added, and the operator
    # ruled explicitly that approval is not carried over automatically. Any
    # approval row referencing version 1 is void.
    approval_history:
      - version: 1
        decision: approved
        by: Zvonimir
        on: 2026-09-27
        at_sha: 7a4ab105
        scope: positioning, value proposition and deliverable
        carried_forward: false
    campaigns: []

  OFFER-B-OPERATIONS:
    capability: project_management_time_and_resourcing
    composes: [OFFER-PM-001, OFFER-TT-001, OFFER-RP-001]
    segment: all
    persona: champion
    business_problem: projects tracked in spreadsheets and tools that do not talk to each other, time booked in one tool while budgets sit in another, and no visibility on who is booked on what next week
    value_proposition: projects, tasks, time and next week's bookings in one place
    concrete_deliverable: a single view of every project and its delivery status, time entries linked to the project and budget they belong to, and a forward looking view of who is booked where
    supporting_evidence: []
    cta: see what your projects, your team time and next week's bookings look like in one place
    mechanism: ae_walkthrough_premium_trial
    mechanism_text: a walkthrough with a Productive AE that unlocks the premium trial including Productive's AI features
    mechanism_status: CLIENT_APPROVED
    mechanism_source: client confirmation, Bruno, 2026-09-27
    # AI Time Tracking is the LEAD ai angle for this offer: time tracking is the
    # structural ICP condition, so the ai capability and the capability argument
    # point at the same thing. Operator, 2026-09-27.
    # Same rules as Offer A: one ai capability per message, page_text is verbatim
    # evidence rather than copy, copy may not exceed what the page states.
    ai_capabilities:
      - feature: AI Time Tracking
        lead: true
        page_text: "Productive analyzes calendar events, matches them with previous time entries, and automatically fills out your time sheets."
        traces_to: productive_ai
      - feature: AI Notetaker
        page_text: "The Notetaker that's integrated directly into your workspace. It transcribes, summarizes, and turns action items into tasks, so you can go from meeting to work right away."
        traces_to: productive_ai
      - feature: Agents
        page_text: "Your autonomous, custom-built virtual assistants. Give them instructions and assign them to a specific area, and they handle the busywork for you."
        traces_to: productive_ai
      - feature: Smart Search
        page_text: "Use your own words to search for Docs, Projects, Tasks, Budgets, and more. Find what you need, even when you don't know where to look for it."
        traces_to: productive_ai
      - feature: Smart Filters
        page_text: "Use natural language prompts to see exactly what you need across Task, Budget, Deal, Time, and Resourcing views."
        traces_to: productive_ai
    cta_link: https://productive.io/get-started/
    conditions: the AE walkthrough and the premium trial it unlocks are the only licensed mechanisms; the self serve 14 day trial is not used in copy
    approval_status: pending
    version: 2
    # As with Offer A: the operator approved version 1's positioning, value
    # proposition and deliverable on 2026-09-27, and that approval does NOT carry
    # to version 2. Version 1 also carried the self serve 14 day trial, which the
    # operator has since removed from copy. Any approval row for version 1 is void.
    approval_history:
      - version: 1
        decision: approved
        by: Zvonimir
        on: 2026-09-27
        at_sha: 7a4ab105
        scope: positioning, value proposition and deliverable
        carried_forward: false
    campaigns: []

# What the client must supply before offers can carry evidence, commercial
# terms or verified outcomes. Seeded from what is already known absent.
# Keyed by gap name so the existing YAML parser handles it without block lists.
missing:
  customer_case_studies:
    gap: customer case studies
    detail: no documented customer outcomes or case studies available
  verified_benchmarks:
    gap: verified benchmarks
    detail: no before-and-after metrics from comparable firms
  dashboard_or_workflow_example:
    gap: dashboard or workflow example
    detail: no screenshot or walkthrough of the Productive interface
  calculator:
    gap: calculator
    detail: no ROI or savings calculator available for prospects
  demo_link:
    gap: demo link
    detail: no live demo environment or recorded demo available

