    provenance: publicly stated on productive.io and present in the client original brief. NOT in canonical config - productive.yaml has no offers block, verified 2026-09-26. Client reconfirmation requested 2026-09-26.
    withheld_reason: >
      Operator decision 2026-09-27: the self serve trial is out of prospect facing
      copy until its provenance is closed by client reconfirmation or canonical
      config. Kept recorded rather than deleted so the decision stays auditable
      and the mechanism can be relicensed without being reinvented. Superseded
