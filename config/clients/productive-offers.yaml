# The Offer Library for Productive.
#
# Offers are DATA. No model creates one. Every field below comes from the
# client's own words in productive.yaml product.capabilities or from what the
# operator has explicitly supplied. No deliverable, discount, guarantee or
# commercial term is invented here.
#
# approval_status: pending | approved | refused
# An offer whose approval_status is not "approved" CANNOT reach copy
# generation. Production does not approve its own offers.
#
# Schema from ARCHITECTURE-UPGRADE-SPEC section 3E.
#
# REAFFIRMED WITHOUT CHANGE — Zvonimir, 2026-09-27 evening.
# The operator restated this library's terms in full and every one of them was
# already recorded here as stated: Offers A v2 and B v2 stay approved; AI
# capabilities are supporting angles only, at most one per message, never
# required, never "AI feature first, then invent a problem"; the one licensed
# mechanism is the AE walkthrough that unlocks the premium trial including the
# AI features (CLIENT_APPROVED, Bruno, 2026-09-27); the self serve 14 day trial
# stays RECORDED_NOT_LICENSED_FOR_COPY; no case study, figure or customer name
# is licensed while every `page_text` under customer_case_studies is null; the
# single CTA is https://productive.io/get-started/.
# NOTHING WAS EDITED in response to that restatement, deliberately. The rules
# below are the canonical record and a second copy of them phrased as a
# confirmation is a second thing to drift. What this stamp adds is the date the
# terms were last confirmed against the operator's own words.

# AI IS A SUPPORTING ANGLE, NEVER THE OFFER. Operator rule, 2026-09-27.
#
# The failure this prevents: Productive outreach turning into a generic "AI
# product" pitch. Productive sells agency operations software. The AI features
# are real and licensed, and they are a reason to believe the mechanism, not the
# reason to buy.
#
# The forbidden direction is explicit: never start from an AI feature and invent
# a problem around it. Start from the prospect's problem, select the core
# capability that addresses it, and only then consider whether one AI capability
# strengthens that specific angle.
messaging_rules:
  ai_is_supporting: true
  max_ai_capabilities_per_message: 1
  ai_required: false           # never force one into a message
  forbidden_direction: ai feature first, then invent a problem around it
  offer_spines:
    OFFER-A-ECONOMIC-BUYER: profitability -> budgeting -> financial and operational visibility
    OFFER-B-OPERATIONS: project management -> time tracking -> resource planning
  permitted_chains:
    economic_buyer: margin or budget problem -> Productive core capability -> Report Intelligence MAY strengthen the mechanism
    operations: time tracking problem -> Productive core capability -> AI Time Tracking MAY strengthen the mechanism
  enforced_by: sequencegate checks step_objectives; copylint traces every claim to stored page text
  # ENFORCEMENT IS NOT YET BUILT. These are data, and data is not a gate.
  # sequencegate does not read step_objectives today. Until it does, this block
  # documents intent and nothing refuses a message that ignores it. That wiring
  # is part of the one-account dry run's acceptance, not a separate feature.
  enforcement_status: DATA_ONLY_NOT_YET_ENFORCED

capabilities:
  OFFER-PM-001:
    capability: project_management
    segment: all
    persona: champion
    business_problem: projects tracked in spreadsheets and tools that do not talk to each other
    value_proposition: projects, tasks and delivery in one place
    concrete_deliverable: a single view of every project, its tasks and its delivery status
    supporting_evidence: []
    cta: see what your projects look like in one place
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: [503]

  OFFER-TT-001:
    capability: time_tracking
    segment: all
    persona: champion
    business_problem: time booked in one tool and budgets tracked in another
    value_proposition: time booked against the project and the budget it belongs to
    concrete_deliverable: time entries linked to the project and budget they belong to
    supporting_evidence: []
    cta: see where your team time actually goes
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: [503]

  OFFER-BU-001:
    capability: budgeting
    segment: all
    persona: economic_buyer
    business_problem: a project quoted at one number and burning at another with no visibility in between
    value_proposition: what a project was quoted at and what it has burned so far
    concrete_deliverable: budget burn visibility from quote to current spend
    supporting_evidence: []
    cta: know whether a project is making money while it is still running
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  OFFER-RP-001:
    capability: resource_planning
    segment: all
    persona: champion
    business_problem: no visibility on who is booked on what next week
    value_proposition: who is booked on what next week, and where the next hire goes
    concrete_deliverable: a forward-looking view of who is booked where and where the next hire goes
    supporting_evidence: []
    cta: see who is booked on what next week
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  OFFER-BI-001:
    capability: billing
    segment: all
    persona: economic_buyer
    business_problem: invoices retyped from time and budget records instead of raised from them
    value_proposition: invoices raised from the time and the budget rather than retyped
    concrete_deliverable: invoices generated directly from tracked time and project budgets
    supporting_evidence: []
    cta: stop retyping invoices from spreadsheets
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

  OFFER-PR-001:
    capability: profitability
    segment: all
    persona: economic_buyer
    business_problem: margin visible only after a project closes, not while it is running
    value_proposition: margin per project while it is running, not after it closes
    concrete_deliverable: margin per project visible while the project is still running
    supporting_evidence: []
    cta: see project margin while the project is still running
    conditions: no commercial terms - capability description only
    approval_status: pending
    version: 1
    campaigns: []

# The two real offers. Each references capability ids; value propositions stay
# in `capabilities:` where they are CLIENT_APPROVED verbatim. An offer names,
# it does not restate. Both are pending - operator approval is explicit and
# has not yet been given.
offers:
  OFFER-A-ECONOMIC-BUYER:
    persona: economic_buyer
    capabilities: [profitability, budgeting]
    problem: margin and budget position invisible until a project closes
    mechanism: demo
    cta_link: https://productive.io/get-started/
