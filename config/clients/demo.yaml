# A wholly fictional client, used by the end-to-end campaign test.
#
# Nothing here describes a real company, a real person, a real market or a real
# Slack workspace. Every domain is .test, every Slack id is a placeholder, and
# the ids are shaped like Slack ids only so the permission checks exercise the
# same code path a real one would. tests/test_fixture_hygiene.py keeps it that
# way.
#
# It lives in config/ rather than tests/fixtures/ because clients.load() reads
# from config/clients, and the end-to-end test is worth running against the
# real loader rather than a stub of it.

name: Demo Client
domain: demo.test
booking_link: https://demo.test/book

sender:
  mode: client_rep
  name: Demo Sender
  title: Head of Demo
  email: demo.sender@demo.test

market:
  must: a services business that tracks time
  size_min_employees: 10
  geos: [United Kingdom, Ireland]
  exclude_geos: [Antarctica]
  flag_dont_drop: true

personas:
  champion:
    titles: [Operations Manager, Head of Operations, Finance Manager]
    cap_per_domain: 2
    angles:
      ops: utilisation, capacity planning, one system not five
      finance: margin per project, month end reconciliation
  economic_buyer:
    titles: [CEO, Managing Director, Founder]
    cap_per_domain: 1
    start_offset_days: 5
    angles:
      founder: profitability visible on Monday not two weeks late

cadence: demo_default

tone:
  email: plain, direct, no em dashes, no buzzwords
  linkedin: casual, lowercase, human

slack:
  enabled: true
  approvals_channel: C0DEMOAPPROV
  positive_replies_channel: C0DEMOPOSITI
  operational_alerts_channel: C0DEMOALERTS
  allowed_approvers: [U0DEMOADMIN1]
  allowed_reviewer_groups: [S0DEMOREVIEW]
  notify:
    campaign_ready: true
    positive_reply: true
    credit_cap_reached: true
    batch_complete: true
    provider_failure: true
    large_held_count: true
  thresholds:
    held_count_threshold: 2
    provider_failure_threshold: 2

research:
  recent_signals:
    enabled: true
    max_people_per_company: 2
    max_posts_per_person: 3
    max_sources_per_company: 10
    min_relevance_score: 0.65
    freshness:
      high_days: 30
      medium_days: 90
      maximum_days: 365
  apify:
    enabled: true
    max_runs_per_batch: 5
    max_items_per_run: 20
    max_pages_per_domain: 5

# ------------------------------------------------- email security (MX)
#
# Some gateways quarantine cold mail so reliably that sending into them costs
# sender reputation and buys nothing. Naming one here stops the EMAIL channel
# for contacts whose ADDRESS domain sits behind it - the contact stays in the
# campaign and LinkedIn is untouched.
#
# Google Workspace and Microsoft 365 are recognised and deliberately NOT
# blocked: they are where most of the addressable market reads its mail.
email_security:
  mx_filter:
    enabled: true

    # Only names this build can identify from an MX hostname with no
    # ambiguity: barracuda, proofpoint, mimecast, cisco, forcepoint,
    # trendmicro, spamtitan, hornetsecurity, symantec, sophos.
    blocked_providers: [barracuda, proofpoint, mimecast]

    # What to do when the MX belongs to nobody we recognise. `allow` lets
    # normal verification decide; `block` is available but will refuse a lot
    # of perfectly ordinary self-hosted mail.
    unknown_provider_policy: allow

    # MX changes rarely. One lookup per domain per week is plenty.
    cache_days: 7


# The demo client's provider identities, declared so the tenancy check has
# something to check. `stage()` compares this against
# `bison.bound_workspace()` and SKIPS the comparison when it is absent -
# `if expected is not None` - so an undeclared workspace means the refusal
# that stops one client's campaign being built inside another's estate never
# fires. It also means configdiff derives an empty workspace and the
# comparison can never match. 99 is the value tests/
# test_no_activation_without_an_exact_match.py has always asserted.
providers:
  emailbison:
    workspace: 99


# The demo client's EMAIL SEQUENCE, declared so the sequence half of the
# provider-agreement gate has something to compare.
#
# `bisonfactory._sequence_steps` builds the expected provider sequence from
# this block, and `configdiff.approved_bison` calls the same function to build
# side A of the diff. With no block at all it returns `[]`, so the approved
# sequence was EMPTY: subjects, bodies, delays, thread_replies and actions all
# came out as empty tuples and every sequence mutation had nothing to mutate.
# A gate whose expected side is empty agrees with any provider, which is the
# one direction a safety comparator must never fail in.
#
# THE KEYS AND THE WAITS ARE NOT FREE. `_sequence_steps` refuses a block whose
# keys are not exactly the cadence's email steps in cadence order, and it
# checks every declared `wait_in_days` against the gap the cadence describes.
# `demo_default` runs email on days 1, 5, 10, 15 and 21, so the keys are
# day1/day5/day10/day15/day21 and the gaps are 4, 5, 5 and 6.
#
# THREAD-REPLY INVARIANT, the same one `productive.yaml` carries: only the
# opener owns a subject. Every step references `{SUBJECT_1}`; the follow-ups
# are thread replies, so EmailBison continues the original thread and prepends
# `Re:` itself. There is exactly ONE subject variable per lead - `subject_1` -
# and no `subject_2`..`subject_5` exists to be generated, approved or
# accidentally sent. Do not write `Re:` into a subject here; the provider does
# it, and a hand-built `Re:` chain is the simulated threading this forbids.
email_sequence:
  title: Resonate demo cadence
  thread_reply_pattern: [false, true, true, true, true]
  steps:
    day1:
      order: 1
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_1}</p>"
      wait_in_days: 4
    day5:
      order: 2
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_2}</p>"
      wait_in_days: 5
    day10:
      order: 3
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_3}</p>"
      wait_in_days: 5
    day15:
      order: 4
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_4}</p>"
      wait_in_days: 6
    day21:
      order: 5
      subject: "{SUBJECT_1}"
      body: "<p>{BODY_5}</p>"
      # 1, not 0. `wait_in_days` is the gap until the NEXT step, so on the
      # final step it is inert - nothing follows it. 0 was rejected by the
      # provider on campaign 485, which is why productive.yaml carries 1 here
      # too.
      wait_in_days: 1
